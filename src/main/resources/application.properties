spring.application.name=messaging-service

# Local secrets: values in a ".env" file next to the project (git-ignored) fill the ${...}
# placeholders below. Real environment variables take precedence. The file is optional.
spring.config.import=optional:file:.env[.properties]

# Shared HTTP client settings for every RestClient.Builder (all provider adapters).
# The JDK HttpClient is pinned so network errors always look the same to MessageService.
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=10s
spring.http.clients.imperative.factory=jdk

# Routing, one block per channel.
# primary-provider is used when the request has no "provider".
messaging.channels.sms.primary-provider=TWILIO
messaging.channels.sms.enabled-providers=TWILIO,VONAGE

# Credentials and senders, one block per provider.
# Secrets come from environment variables; ":" means empty when the variable is not set.
messaging.providers.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
messaging.providers.twilio.api-key=${TWILIO_API_KEY:}
messaging.providers.twilio.api-secret=${TWILIO_API_SECRET:}
messaging.providers.twilio.sms-from=${TWILIO_SMS_FROM:}

messaging.providers.vonage.api-key=${VONAGE_API_KEY:}
messaging.providers.vonage.api-secret=${VONAGE_API_SECRET:}
messaging.providers.vonage.sms-from=${VONAGE_SMS_FROM:}
