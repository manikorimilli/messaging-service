spring.application.name=messaging-service

# Local secrets: values in a ".env" file next to the project (git-ignored) fill the ${...}
# placeholders. Real environment variables take precedence. The file is optional.
# providers.json holds everything about providers: routing per channel (primary and enabled
# providers) and how to call each one. "[.yaml]" tells Spring to read it with the YAML loader,
# which reads JSON too (JSON is a subset of YAML).
spring.config.import=optional:file:.env[.properties],classpath:providers.json[.yaml]

# Shared HTTP client settings for every RestClient.Builder (all provider adapters).
# The JDK HttpClient is pinned so network errors always look the same to MessageService.
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=10s
spring.http.clients.imperative.factory=jdk

# Routing lives in providers.json (messaging.channels.*). It can still be overridden with
# environment variables, e.g. MESSAGING_CHANNELS_SMS_PRIMARYPROVIDER=VONAGE.
